name: Deploy ORIGEN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate active JavaScript syntax
        shell: bash
        run: |
          grep -oE 'src="[^"]+\.js(\?[^"]*)?"' index.html \
            | sed -E 's/^src="//; s/"$//; s/\?.*$//' \
            | while read -r file; do
                echo "Checking $file"
                node --check "$file"
              done
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
